when:
  - event: pull_request
    path:
      exclude:
        - docs/**
        - "*.md"
        - .agents/**
        - .cursor/**
    evaluate: 'CI_COMMIT_PULL_REQUEST_DRAFT == "false" && CI_COMMIT_AUTHOR == "daFailer"'
  - event: pull_request_metadata
    path:
      exclude:
        - docs/**
        - "*.md"
        - .agents/**
        - .cursor/**
    evaluate: 'CI_PIPELINE_EVENT_REASON == "ready_for_review" && CI_COMMIT_AUTHOR == "daFailer"'

steps:
  - name: verify
    image: node:24-alpine@sha256:e67514e5d0f6c46656005e1b693b2ec9d52e80b641307de684d4a015ba7a4eaf
    commands:
      - set -Eeuo pipefail
      - apk add --no-cache bash
      - npm ci
      - npm run lint
      - npm run build
      - bash -n scripts/ci/*.sh

  - name: publish
    image: woodpeckerci/plugin-docker-buildx:6.1.2@sha256:d26b69cbe748b8a219c707e7889d5ffb3f9214bc3c480c30fe857ff85954267c
    privileged: true
    settings:
      registry: ghcr.io
      username: daFailer
      password:
        from_secret: ghcr_token
      repo: ghcr.io/dafailer/svg-encoder
      tags: pr-${CI_COMMIT_PULL_REQUEST}-${CI_COMMIT_SHA}
      dockerfile: Dockerfile
      target: runtime
      platforms: linux/amd64
      provenance: false
      auto_tag: false
      cache_from:
        - "type=registry\\,ref=ghcr.io/dafailer/svg-encoder:buildcache"
      cache_to: "type=registry,ref=ghcr.io/dafailer/svg-encoder:buildcache,mode=max"
      labels:
        - org.opencontainers.image.source=https://github.com/daFailer/svg-encoder
        - org.opencontainers.image.revision=${CI_COMMIT_SHA}

  - name: preview-up
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    environment:
      EXPECTED_DEPLOY_USER: deploy-svg-encoder-nonprod
      GHCR_TOKEN:
        from_secret: ghcr_token
      DEPLOY_HOST:
        from_secret: deploy_host
      DEPLOY_PORT:
        from_secret: deploy_port
      DEPLOY_USER:
        from_secret: deploy_user
      DEPLOY_KNOWN_HOSTS:
        from_secret: deploy_known_hosts
      DEPLOY_SSH_KEY:
        from_secret: deploy_ssh_key
    commands:
      - |
        set -Eeuo pipefail
        apk add --no-cache bash skopeo openssh-client curl jq
        title="$$(bash scripts/ci/preview-eligible.sh)"
        [[ -n "$$title" ]] || exit 0
        printf '%s' "$$GHCR_TOKEN" | skopeo login ghcr.io --username daFailer --password-stdin
        app_ref="$$(bash scripts/ci/ghcr-digest.sh ghcr.io/dafailer/svg-encoder pr-${CI_COMMIT_PULL_REQUEST}-${CI_COMMIT_SHA})"
        bash scripts/ci/ssh-platform-deploy.sh nonprod preview-up svg-encoder ${CI_COMMIT_PULL_REQUEST} ${CI_COMMIT_SHA} "$$app_ref" "$$title" \
          | bash scripts/ci/github-preview-deployment.sh create svg-encoder ${CI_COMMIT_PULL_REQUEST} ${CI_COMMIT_SHA}
