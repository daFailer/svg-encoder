when:
  - event: pull_request_closed
    evaluate: 'CI_COMMIT_AUTHOR == "daFailer"'
  - event: pull_request_metadata
    evaluate: 'CI_PIPELINE_EVENT_REASON == "converted_to_draft" && CI_COMMIT_AUTHOR == "daFailer"'

steps:
  - name: preview-down
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    environment:
      EXPECTED_DEPLOY_USER: deploy-svg-encoder-nonprod
      GHCR_TOKEN:
        from_secret: ghcr_token
      DEPLOY_HOST:
        from_secret: deploy_host
      DEPLOY_PORT:
        from_secret: deploy_port
      DEPLOY_USER:
        from_secret: deploy_user
      DEPLOY_KNOWN_HOSTS:
        from_secret: deploy_known_hosts
      DEPLOY_SSH_KEY:
        from_secret: deploy_ssh_key
    commands:
      - |
        set -Eeuo pipefail
        [[ "${CI_COMMIT_PULL_REQUEST:-}" =~ ^[1-9][0-9]*$$ ]]
        apk add --no-cache bash openssh-client curl jq
        bash scripts/ci/ssh-platform-deploy.sh nonprod preview-down svg-encoder ${CI_COMMIT_PULL_REQUEST}
        bash scripts/ci/github-preview-deployment.sh inactive svg-encoder ${CI_COMMIT_PULL_REQUEST}
