name: Remove svg-encoder preview

on:
  pull_request_target:
    types: [closed, converted_to_draft]

permissions:
  contents: read
  deployments: write
  pull-requests: read

concurrency:
  group: svg-encoder-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY_NONPROD }}
    steps:
      - name: Remove server resources
        run: |
          set -Eeuo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$DEPLOY_HOST" =~ ^[0-9a-fA-F:.]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_USER" == "deploy-svg-encoder-nonprod" ]]
          [[ -n "$DEPLOY_KNOWN_HOSTS" && -n "$DEPLOY_SSH_KEY" ]]
          umask 077
          key_file="${RUNNER_TEMP}/nonprod-key"
          known_hosts_file="${RUNNER_TEMP}/known-hosts"
          trap 'rm -f -- "$key_file" "$known_hosts_file"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts_file"
          ssh -i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts_file" \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "platform-deploy nonprod preview-down svg-encoder $PR_NUMBER"

      - name: Mark latest deployment inactive
        run: |
          set -Eeuo pipefail
          environment="svg-encoder-pr-${PR_NUMBER}"
          deployment_id="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/deployments?environment=$environment&per_page=1" \
            | jq -r '.[0].id // empty')"
          [[ -z "$deployment_id" ]] && exit 0
          curl --fail --silent --show-error --request POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
            --data '{"state":"inactive","description":"Preview resources removed.","auto_inactive":false}' >/dev/null
