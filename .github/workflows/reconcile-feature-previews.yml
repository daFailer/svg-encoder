name: Reconcile Feature Previews

on:
  schedule:
    - cron: "52 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pull-requests: read

concurrency:
  group: svg-encoder-preview-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile Feature Previews
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY_NONPROD }}
    steps:
      - name: Read eligible pull requests and reconcile
        run: |
          set -Eeuo pipefail
          pulls="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100")"
          open_prs="$(jq -r --arg repository "$GITHUB_REPOSITORY" --arg owner "$GITHUB_REPOSITORY_OWNER" \
            '[.[] | select(.draft == false and .head.repo.full_name == $repository and .user.login == $owner and .user.login != "dependabot[bot]") | .number] | sort | join(",")' <<<"$pulls")"
          [[ -n "$open_prs" ]] || open_prs=-
          [[ "$DEPLOY_HOST" =~ ^[0-9a-fA-F:.]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_USER" == "deploy-svg-encoder-nonprod" ]]
          [[ -n "$DEPLOY_KNOWN_HOSTS" && -n "$DEPLOY_SSH_KEY" ]]
          umask 077
          key_file="${RUNNER_TEMP}/nonprod-key"
          known_hosts_file="${RUNNER_TEMP}/known-hosts"
          trap 'rm -f -- "$key_file" "$known_hosts_file"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts_file"
          ssh -i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts_file" \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "platform-deploy nonprod reconcile svg-encoder $open_prs"
