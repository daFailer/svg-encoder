name: Deploy App Staging

on:
  workflow_run:
    workflows: [Build App]
    types: [completed]

permissions:
  contents: read
  packages: read

concurrency:
  group: svg-encoder-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy App Staging
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      APP_REPOSITORY: ghcr.io/dafailer/svg-encoder
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY_NONPROD }}
    steps:
      - name: Resolve published digest for the build commit
        id: image
        env:
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$BUILD_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image_tag="${APP_REPOSITORY}:sha-${BUILD_SHA}"
          digest="$(docker buildx imagetools inspect "$image_tag" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            printf 'sha=%s\n' "$BUILD_SHA"
            printf 'app_ref=%s@%s\n' "$APP_REPOSITORY" "$digest"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy the exact release to staging
        env:
          BUILD_SHA: ${{ steps.image.outputs.sha }}
          APP_DIGEST_REF: ${{ steps.image.outputs.app_ref }}
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOY_HOST" =~ ^[0-9a-fA-F:.]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_USER" == "deploy-svg-encoder-nonprod" ]]
          [[ -n "$DEPLOY_KNOWN_HOSTS" && -n "$DEPLOY_SSH_KEY" ]]
          umask 077
          key_file="${RUNNER_TEMP}/nonprod-key"
          known_hosts_file="${RUNNER_TEMP}/known-hosts"
          trap 'rm -f -- "$key_file" "$known_hosts_file"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts_file"
          ssh -i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts_file" \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "platform-deploy nonprod stage svg-encoder $BUILD_SHA $APP_DIGEST_REF"
