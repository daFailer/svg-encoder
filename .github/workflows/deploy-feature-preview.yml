name: Deploy Feature Preview

on:
  workflow_run:
    workflows: [Build Feature Preview]
    types: [completed]

permissions:
  contents: read
  deployments: write
  packages: read
  pull-requests: read

concurrency:
  group: svg-encoder-preview-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Feature Preview
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      APP_REPOSITORY: ghcr.io/dafailer/svg-encoder
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY_NONPROD }}
    steps:
      - name: Revalidate pull request metadata
        id: metadata
        run: |
          set -Eeuo pipefail
          pr_number="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
          head_sha="$(jq -r '.workflow_run.pull_requests[0].head.sha // empty' "$GITHUB_EVENT_PATH")"
          [[ "$pr_number" =~ ^[1-9][0-9]*$ ]] || {
            printf 'Build Feature Preview succeeded but no pull request was attached to the workflow_run event.\n' >&2
            exit 1
          }
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          pr_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$pr_number")"
          if ! jq -e --arg sha "$head_sha" --arg repository "$GITHUB_REPOSITORY" --arg owner "$GITHUB_REPOSITORY_OWNER" \
            '.state == "open" and .draft == false and .head.sha == $sha and .head.repo.full_name == $repository and .user.login == $owner and .user.login != "dependabot[bot]"' \
            <<<"$pr_json" >/dev/null; then
            printf 'Build Feature Preview succeeded but PR #%s is no longer eligible for a feature preview.\n' "$pr_number" >&2
            exit 1
          fi
          printf 'pr=%s\nsha=%s\n' "$pr_number" "$head_sha" >> "$GITHUB_OUTPUT"

      - name: Resolve image digest
        id: image
        env:
          PR_NUMBER: ${{ steps.metadata.outputs.pr }}
          PR_SHA: ${{ steps.metadata.outputs.sha }}
        run: |
          set -Eeuo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image_tag="${APP_REPOSITORY}:pr-${PR_NUMBER}-${PR_SHA}"
          digest="$(docker buildx imagetools inspect "$image_tag" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'ref=%s@%s\n' "$APP_REPOSITORY" "$digest" >> "$GITHUB_OUTPUT"

      - name: Create transient deployment
        id: deployment
        env:
          PR_NUMBER: ${{ steps.metadata.outputs.pr }}
          PR_SHA: ${{ steps.metadata.outputs.sha }}
        run: |
          set -Eeuo pipefail
          payload="$(jq -cn --arg ref "$PR_SHA" --arg environment "svg-encoder-pr-${PR_NUMBER}" \
            '{ref:$ref,environment:$environment,auto_merge:false,required_contexts:[],transient_environment:true,production_environment:false}')"
          response="$(curl --fail --silent --show-error --request POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/deployments" --data "$payload")"
          printf 'id=%s\n' "$(jq -er '.id' <<<"$response")" >> "$GITHUB_OUTPUT"

      - name: Deploy and publish status
        env:
          PR_NUMBER: ${{ steps.metadata.outputs.pr }}
          PR_SHA: ${{ steps.metadata.outputs.sha }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOY_HOST" =~ ^[0-9a-fA-F:.]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_USER" == "deploy-svg-encoder-nonprod" ]]
          [[ -n "$DEPLOY_KNOWN_HOSTS" && -n "$DEPLOY_SSH_KEY" ]]
          umask 077
          key_file="${RUNNER_TEMP}/nonprod-key"
          known_hosts_file="${RUNNER_TEMP}/known-hosts"
          trap 'rm -f -- "$key_file" "$known_hosts_file"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts_file"
          set +e
          ssh -i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts_file" \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "platform-deploy nonprod preview-up svg-encoder $PR_NUMBER $PR_SHA $IMAGE_REF"
          result=$?
          set -e
          [[ "$result" -eq 0 ]] && state=success || state=failure
          payload="$(jq -cn --arg state "$state" \
            --arg url "https://svg-encoder-pr-${PR_NUMBER}.lab.michaelvogtherr.de" \
            --arg log_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:$state,environment_url:$url,log_url:$log_url,auto_inactive:false}')"
          curl --fail --silent --show-error --request POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" \
            --data "$payload" >/dev/null
          exit "$result"
