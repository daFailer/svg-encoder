name: svg-encoder release image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: svg-encoder-staging
  cancel-in-progress: false

jobs:
  publish-and-stage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_REPOSITORY: ghcr.io/dafailer/svg-encoder
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY_NONPROD }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Verify the application
        run: |
          set -Eeuo pipefail
          npm ci
          npm run lint
          npm run build

      - name: Publish immutable image
        run: |
          set -Eeuo pipefail
          printf '%s' "${{ github.token }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          image_tag="${APP_REPOSITORY}:sha-${GITHUB_SHA}"
          docker buildx build \
            --platform linux/amd64 \
            --target runtime \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image_tag" \
            --push .
          digest="$(docker buildx imagetools inspect "$image_tag" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'APP_DIGEST_REF=%s@%s\n' "$APP_REPOSITORY" "$digest" >> "$GITHUB_ENV"

      - name: Deploy the exact release to staging
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOY_HOST" =~ ^[0-9a-fA-F:.]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_USER" == "deploy-svg-encoder-nonprod" ]]
          [[ -n "$DEPLOY_KNOWN_HOSTS" && -n "$DEPLOY_SSH_KEY" ]]
          umask 077
          key_file="${RUNNER_TEMP}/nonprod-key"
          known_hosts_file="${RUNNER_TEMP}/known-hosts"
          trap 'rm -f -- "$key_file" "$known_hosts_file"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts_file"
          ssh -i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts_file" \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "platform-deploy nonprod stage svg-encoder $GITHUB_SHA $APP_DIGEST_REF"
