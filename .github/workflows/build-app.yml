name: Build App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: svg-encoder-build-app
  cancel-in-progress: false

jobs:
  build:
    name: Build App
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_REPOSITORY: ghcr.io/dafailer/svg-encoder
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Verify the application
        run: |
          set -Eeuo pipefail
          npm ci
          npm run lint
          npm run build

      - name: Publish immutable image
        run: |
          set -Eeuo pipefail
          printf '%s' "${{ github.token }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          image_tag="${APP_REPOSITORY}:sha-${GITHUB_SHA}"
          docker buildx build \
            --platform linux/amd64 \
            --target runtime \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image_tag" \
            --push .
          digest="$(docker buildx imagetools inspect "$image_tag" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
